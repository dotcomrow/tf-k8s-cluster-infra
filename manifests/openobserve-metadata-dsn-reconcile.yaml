apiVersion: v1
kind: ServiceAccount
metadata:
  name: openobserve-metadata-dsn-reconciler
  namespace: openobserve
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openobserve-metadata-dsn-reconciler
  namespace: openobserve
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - openobserve-postgres-app
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - openobserve
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openobserve-metadata-dsn-reconciler
  namespace: openobserve
subjects:
  - kind: ServiceAccount
    name: openobserve-metadata-dsn-reconciler
    namespace: openobserve
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openobserve-metadata-dsn-reconciler
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openobserve-metadata-dsn-reconcile
  namespace: openobserve
  labels:
    app.kubernetes.io/name: openobserve
    app.kubernetes.io/component: metadata-dsn-reconciler
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openobserve
        app.kubernetes.io/component: metadata-dsn-reconciler
    spec:
      serviceAccountName: openobserve-metadata-dsn-reconciler
      priorityClassName: platform-system-high
      restartPolicy: Never
      containers:
        - name: reconcile
          image: alpine/k8s:1.35.3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              read_secret_key() {
                key="$1"
                kubectl -n openobserve get secret openobserve-postgres-app -o "jsonpath={.data.$key}" | base64 -d
              }

              PG_APP_USER="$(read_secret_key username || true)"
              PG_APP_PASS="$(read_secret_key password || true)"
              PG_APP_DB="$(read_secret_key dbname || true)"

              if [ -z "$PG_APP_DB" ]; then
                PG_APP_DB="app"
              fi
              if [ -z "$PG_APP_USER" ] || [ -z "$PG_APP_PASS" ]; then
                echo "OpenObserve Postgres app secret is missing username or password"
                exit 1
              fi

              OO_RW_DSN="postgres://$PG_APP_USER:$PG_APP_PASS@openobserve-postgres-rw.openobserve.svc.cluster.local:5432/$PG_APP_DB?sslmode=disable"
              OO_RW_DSN_B64="$(printf '%s' "$OO_RW_DSN" | base64 | tr -d '\n')"
              PATCH='{"data":{"ZO_META_POSTGRES_DSN":"'"$OO_RW_DSN_B64"'","ZO_META_POSTGRES_RO_DSN":"'"$OO_RW_DSN_B64"'","ZO_META_DDL_DSN":"'"$OO_RW_DSN_B64"'"}}'

              kubectl -n openobserve patch secret openobserve --type=merge -p "$PATCH" >/dev/null

              UPDATED_POSTGRES_DSN="$(kubectl -n openobserve get secret openobserve -o jsonpath='{.data.ZO_META_POSTGRES_DSN}')"
              UPDATED_POSTGRES_RO_DSN="$(kubectl -n openobserve get secret openobserve -o jsonpath='{.data.ZO_META_POSTGRES_RO_DSN}')"
              UPDATED_DDL_DSN="$(kubectl -n openobserve get secret openobserve -o jsonpath='{.data.ZO_META_DDL_DSN}')"
              if [ "$UPDATED_POSTGRES_DSN" != "$OO_RW_DSN_B64" ] || [ "$UPDATED_POSTGRES_RO_DSN" != "$OO_RW_DSN_B64" ] || [ "$UPDATED_DDL_DSN" != "$OO_RW_DSN_B64" ]; then
                echo "OpenObserve metadata DSN reconciliation did not converge"
                exit 1
              fi

              echo "OpenObserve metadata DSNs now target the writable Postgres service"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
