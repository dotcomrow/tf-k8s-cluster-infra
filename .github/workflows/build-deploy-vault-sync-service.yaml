name: Build and Deploy Services

on:
  workflow_dispatch:

permissions: write-all

jobs:
  deploy:
    name: "Build and Deploy"
    runs-on: ubuntu-latest

    env:
      TF_CLOUD_ORGANIZATION: ${{ github.repository_owner }}
      TF_API_TOKEN: ${{ secrets.TFE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Generate GCP-compatible timestamp tag (ts-YYYYMMDD-HHMMSS)
      - name: Set timestamp tag
        id: set-tag
        run: |
          echo "tag=ts-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      # Login to GitHub Container Registry
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      # Build the Docker image with the timestamp tag
      - name: Build Docker image
        run: |
          cd src/vault-sync-svc
          docker build -t ghcr.io/${{ github.repository_owner }}/vault-sync-run-container:${{ steps.set-tag.outputs.tag }} .

      # Push the image to GHCR using the timestamp tag
      - name: Push Docker image to GHCR
        run: |
          cd src/vault-sync-svc
          docker push ghcr.io/${{ github.repository_owner }}/vault-sync-run-container:${{ steps.set-tag.outputs.tag }}

