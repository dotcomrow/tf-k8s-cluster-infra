name: TFC Rebuild Workflow

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Infrastructure action to perform'

permissions: write-all

jobs:
  rebuild:
    name: "Tear Down and Rebuild Infra"
    runs-on: ubuntu-latest
    env:
      TF_CLOUD_ORGANIZATION: ${{ github.repository_owner }}
      TF_API_TOKEN: ${{ secrets.TFE_TOKEN }}

    steps:
      - name: Check state of initial-deploy workflow
        id: check_state
        run: |
          echo "initial_deploy_state=$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' /repos/${{ github.repository_owner }}/${{ github.event.repository.name }}/actions/workflows/initial-deploy.yml | jq -r '.state')" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout
        if: ${{ steps.check_state.outputs.initial_deploy_state == 'disabled_manually' }}
        uses: actions/checkout@v3

      - name: Upload Configuration
        if: ${{ steps.check_state.outputs.initial_deploy_state == 'disabled_manually' }}
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.1.1
        id: upload
        with:
          workspace: ${{ github.event.repository.name }}
          directory: terraform

      - name: Trigger Destroy Run
        if: ${{ steps.check_state.outputs.initial_deploy_state == 'disabled_manually' }}
        id: destroy-run
        run: |
          WORKSPACE_NAME="${{ github.event.repository.name }}"
          ORG_NAME="${{ github.repository_owner }}"
          TOKEN="${{ secrets.TFE_TOKEN }}"
  
          WORKSPACE_ID=$(curl -s \
            --header "Authorization: Bearer $TOKEN" \
            --header "Content-Type: application/vnd.api+json" \
            https://app.terraform.io/api/v2/organizations/$ORG_NAME/workspaces/$WORKSPACE_NAME | jq -r '.data.id')
  
          echo "🧨 Triggering destroy for workspace $WORKSPACE_NAME..."
  
          curl -s -X POST \
            --header "Authorization: Bearer $TOKEN" \
            --header "Content-Type: application/vnd.api+json" \
            --data '{
              "data": {
                "attributes": {
                  "is-destroy": true,
                  "message": "Destroy triggered from GitHub Actions (rebuild)"
                },
                "type": "runs",
                "relationships": {
                  "workspace": {
                    "data": {
                      "type": "workspaces",
                      "id": "'"$WORKSPACE_ID"'"
                    }
                  }
                }
              }
            }' \
            https://app.terraform.io/api/v2/runs | jq

      - name: Wait for destroy to complete
        if: ${{ steps.check_state.outputs.initial_deploy_state == 'disabled_manually' }}
        run: |
          echo "🕐 Waiting for 90s before proceeding to re-apply"
          sleep 90

      - name: Re-apply Terraform
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.1.1
        if: ${{ steps.check_state.outputs.initial_deploy_state == 'disabled_manually' }}
        with:
          workspace: ${{ github.event.repository.name }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          plan_only: false
