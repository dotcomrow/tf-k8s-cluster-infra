name: TFC Rebuild Workflow

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Operation mode'
        required: true
        default: 'rebuild-vms'
        type: choice
        options:
          - apply-all
          - apply-vms
          - rebuild-all
          - rebuild-vms

permissions: write-all

jobs:
  tfc:
    name: "Terraform: ${{ github.event.inputs.mode }}"
    runs-on: ubuntu-latest
    env:
      TF_CLOUD_ORGANIZATION: ${{ github.repository_owner }}
      TF_API_TOKEN: ${{ secrets.TFE_TOKEN }}
      MODE: ${{ github.event.inputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Upload Terraform Configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.1.1
        id: upload
        with:
          workspace: ${{ github.event.repository.name }}
          directory: terraform

      - name: Force stop Proxmox VMs locally (rebuild-vms only)
        if: ${{ github.event.inputs.mode == 'rebuild-vms' }}
        run: |
          echo "⚡ Force stopping Proxmox VMs for rebuild"

          for vm in ctrl-node etcd-node work-node srvr-node; do
            echo "🔌 Stopping $vm"
            vmid=$(sudo /usr/sbin/qm list | awk -v name="$vm" '$0 ~ name {print $1}')
            if [[ -n "$vmid" ]]; then
              echo "VM ID for $vm: $vmid"
              sudo /usr/sbin/qm stop "$vmid" || true
            else
              echo "⚠️  VM $vm not found — skipping"
            fi
          done

      - name: Trigger Terraform Destroy
        if: contains(fromJson('["rebuild-all", "rebuild-vms"]'), env.MODE)
        run: |
          WORKSPACE_NAME="${{ github.event.repository.name }}"
          ORG_NAME="${{ github.repository_owner }}"
          TOKEN="${{ secrets.TFE_TOKEN }}"

          WORKSPACE_ID=$(curl -s \
            --header "Authorization: Bearer $TOKEN" \
            --header "Content-Type: application/vnd.api+json" \
            https://app.terraform.io/api/v2/organizations/$ORG_NAME/workspaces/$WORKSPACE_NAME | jq -r '.data.id')

          if [[ "$MODE" == "rebuild-vms" ]]; then
            TARGET_JSON='[
              "proxmox_virtual_environment_vm.ctrl_rancher_vm",
              "proxmox_virtual_environment_vm.etcd_rancher_vm",
              "proxmox_virtual_environment_vm.work_rancher_vm",
              "proxmox_virtual_environment_vm.srvr_rancher_vm",
              "proxmox_virtual_environment_file.ctrl_cloud_init_config",
              "proxmox_virtual_environment_file.etcd_cloud_init_config",
              "proxmox_virtual_environment_file.work_cloud_init_config",
              "proxmox_virtual_environment_file.srvr_cloud_init_config"
            ]'
          else
            TARGET_JSON='null'
          fi

          DATA=$(jq -n \
            --arg wid "$WORKSPACE_ID" \
            --arg targets "$TARGET_JSON" \
            '{
              data: {
                attributes: {
                  "is-destroy": true,
                  "message": "Destroy triggered from GitHub Actions",
                  "target-addrs": ($targets | fromjson)
                },
                type: "runs",
                relationships: {
                  workspace: {
                    data: {
                      type: "workspaces",
                      id: $wid
                    }
                  }
                }
              }
            }')

          echo "Triggering destroy for mode: $MODE"
          echo "$DATA"

          curl -s -X POST \
            --header "Authorization: Bearer $TOKEN" \
            --header "Content-Type: application/vnd.api+json" \
            --data "$DATA" \
            https://app.terraform.io/api/v2/runs | jq

      - name: Wait for destroy to complete
        if: contains(fromJson('["rebuild-all", "rebuild-vms"]'), env.MODE)
        run: |
          echo "🕐 Waiting 90 seconds to allow destroy to complete..."
          sleep 90

      - name: Trigger Terraform Apply
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.1.1
        with:
          workspace: ${{ github.event.repository.name }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          plan_only: false
          target_addrs: >-
            ${{ github.event.inputs.mode == 'apply-vms' || github.event.inputs.mode == 'rebuild-vms'
                && 'proxmox_virtual_environment_vm.ctrl_rancher_vm,proxmox_virtual_environment_vm.etcd_rancher_vm,proxmox_virtual_environment_vm.work_rancher_vm,proxmox_virtual_environment_vm.srvr_rancher_vm'
                || '' }}
